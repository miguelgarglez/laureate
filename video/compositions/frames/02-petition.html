<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'IM Fell'; src: url('assets/fonts/im-fell-english-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IM Fell'; src: url('assets/fonts/im-fell-english-latin-400-italic.woff2') format('woff2'); font-style: italic; }
      @font-face { font-family: 'EB Garamond'; src: url('assets/fonts/eb-garamond-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'EB Garamond'; src: url('assets/fonts/eb-garamond-latin-400-italic.woff2') format('woff2'); font-style: italic; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0b120e; }
      #root { position: absolute; inset: 0; }
      .bloom {
        position: absolute; left: -15%; top: -20%; width: 900px; height: 900px;
        background: radial-gradient(circle, rgba(107, 83, 32, 0.55) 0%, rgba(82, 64, 25, 0.3) 38%, transparent 68%);
      }
      .card-wrap {
        position: absolute; left: 190px; top: 196px;
        width: 700px; height: 844px; padding: 14px;
        border: 1px solid rgba(245, 227, 208, 0.5);
        background: rgba(11, 18, 14, 0.35);
      }
      .card-wrap video { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
      .kicker {
        position: absolute; left: 0; right: 0; top: 48px; text-align: center;
        font-family: 'IM Fell', serif; font-size: 26px; letter-spacing: 0.42em;
        color: rgba(236, 207, 125, 0.9); text-transform: uppercase;
      }
      .cap {
        position: absolute; left: 0; right: 0; top: 92px; text-align: center;
        font-family: 'EB Garamond', serif; font-style: italic; font-size: 52px; color: #f5e3d0;
      }
      .hairline {
        position: absolute; left: 300px; right: 300px; top: 176px; height: 1px;
        background: rgba(245, 227, 208, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="root" class="frame" data-composition-id="frame-02" data-width="1080" data-height="1080">
      <div class="bloom" data-layout-allow-overflow></div>
      <div class="kicker">petition to the committee</div>
      <div class="cap">name the deed.</div>
      <div class="hairline"></div>
      <div class="card-wrap">
        <video id="v-petition" muted playsinline data-start="0" data-duration="5" src="assets/footage/petition.mp4" data-media-start="0.6"></video>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#root', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power1.out' }, 0);
      tl.fromTo('.kicker', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.15);
      tl.fromTo('.cap', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 0.3);
      tl.fromTo('.hairline', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power2.out' }, 0.45);
      tl.fromTo('.card-wrap', { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power2.out' }, 0.35);
      tl.to('.card-wrap', { y: -18, duration: 3.5, ease: 'none' }, 1.4);
      tl.to('#root', { opacity: 0, duration: 0.4, ease: 'power1.in' }, 4.6);
      window.__timelines['frame-02'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
