<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'IM Fell SC'; src: url('assets/fonts/im-fell-english-sc-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'EB Garamond'; src: url('assets/fonts/eb-garamond-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'EB Garamond'; src: url('assets/fonts/eb-garamond-latin-400-italic.woff2') format('woff2'); font-style: italic; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0b120e; }
      #root { position: absolute; inset: 0; }
      .plate { position: absolute; inset: 0; filter: brightness(0.38) blur(3px); }
      .plate video { width: 100%; height: 100%; object-fit: cover; }
      .bloom {
        position: absolute; left: 40px; top: -47px; width: 1000px; height: 1000px;
        background: radial-gradient(circle, rgba(107, 83, 32, 0.5) 0%, rgba(82, 64, 25, 0.22) 42%, transparent 70%);
      }
      .word {
        position: absolute; left: 0; right: 0; top: 372px; text-align: center;
        font-family: 'IM Fell SC', serif; font-size: 128px; letter-spacing: 0.14em;
        color: #eccf7d; text-shadow: 0 3px 34px rgba(0,0,0,.6);
      }
      .word span { display: inline-block; }
      .sub {
        position: absolute; left: 0; right: 0; top: 534px; text-align: center;
        font-family: 'EB Garamond', serif; font-style: italic; font-size: 34px;
        color: rgba(245, 227, 208, 0.85);
      }
      .rule {
        position: absolute; left: 400px; right: 400px; top: 606px; height: 1px;
        background: rgba(236, 207, 125, 0.55);
      }
      .url {
        position: absolute; left: 0; right: 0; top: 640px; text-align: center;
        font-family: 'EB Garamond', serif; font-size: 38px; letter-spacing: 0.06em;
        color: #f5e3d0;
      }
    </style>
  </head>
  <body>
    <div id="root" class="frame" data-composition-id="frame-05" data-width="1080" data-height="1080">
      <div class="plate">
        <video id="v-plate" muted playsinline data-start="0" data-duration="6.5" src="assets/footage/award.mp4" data-media-start="5.5"></video>
      </div>
      <div class="bloom" data-layout-allow-overflow></div>
      <div class="word"><span>L</span><span>A</span><span>U</span><span>R</span><span>E</span><span>A</span><span>T</span><span>E</span></div>
      <div class="sub">a gold medal, for whatever you just did.</div>
      <div class="rule"></div>
      <div class="url">laureate-ivory.vercel.app</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#root', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power1.out' }, 0);
      tl.fromTo('.word span', { opacity: 0, y: 26, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power2.out', stagger: 0.07 }, 0.35);
      tl.fromTo('.sub', { opacity: 0 }, { opacity: 1, duration: 0.7 }, 1.4);
      tl.fromTo('.rule', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'power2.out' }, 1.8);
      tl.fromTo('.url', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 2.1);
      tl.to({}, { duration: 2.3 }, 2.8); // hold
      window.__timelines['frame-05'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
